<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persona Character Sheet</title>

<!-- Fonts: these two are loaded from Google Fonts (needs internet).
     To use a different font, change the link below AND the font names at the top of style.css.
     Offline, the sheet falls back to Courier New automatically. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<!-- THE SHEET. Each field is placed using the numbers in config.js (see the data-pos names). -->
<div id="fit"><div id="sheet">

  <div class="f t-line" data-pos="arcana"><input data-k="arcana" aria-label="Arcana" autocomplete="off"></div>
  <div class="f sig" data-pos="signature"><input data-k="signature" aria-label="Signature" autocomplete="off"></div>
  <div class="f t-line" data-pos="persona"><input data-k="persona" aria-label="Persona name" autocomplete="off"></div>

  <div class="f hpbox" data-pos="hp"><input type="number" inputmode="numeric" id="hpCur" aria-label="Current HP"><span class="sl">/</span><span class="mx" id="hpMax"></span></div>
  <div class="f hpbox" data-pos="sp"><input type="number" inputmode="numeric" id="spCur" aria-label="Current SP"><span class="sl">/</span><span class="mx" id="spMax"></span></div>

  <div class="f t-box" data-pos="level"><input type="number" inputmode="numeric" id="lvIn" aria-label="Level" min="1"></div>
  <div class="f t-box" data-pos="exp"><input type="number" inputmode="numeric" id="expIn" aria-label="Current EXP" min="0"></div>
  <div class="f t-box" data-pos="expNext"><input id="expNext" aria-label="EXP needed for next level" readonly tabindex="-1"></div>
  <div class="f t-box" data-pos="ac"><input type="number" inputmode="numeric" data-k="ac" aria-label="Guard or AC"></div>
  <div class="f t-line" data-pos="player"><input data-k="player" aria-label="Player name" autocomplete="off"></div>

  <div id="affs"></div>   <!-- affinity boxes are created from config.js -->
  <div id="bars"></div>   <!-- stat bars are created from config.js -->

  <div class="f" id="visageWrap" data-pos="visage">
    <label id="visage" title="Add or change your persona's picture"><span class="ph">Click to add a picture</span><input type="file" accept="image/*" aria-label="Upload persona picture"><button type="button" class="rm" id="visRm" aria-label="Remove picture">×</button></label>
  </div>

  <div id="skills" class="sk"></div>   <!-- skills table is created from config.js -->

</div></div>

<!-- CONTROLS UNDER THE SHEET. Delete any panel you do not want. -->
<div class="panel ctl" aria-label="Controls">
  <h2>Level, HP and SP controls</h2>
  <div class="row">
    <div><label for="gain">Gain EXP</label><input id="gain" type="number" inputmode="numeric" min="0" placeholder="0"></div>
    <button class="b pri" type="button" id="gainBtn">Add EXP</button>
    <button class="b" type="button" id="rest">Restore HP and SP to full</button>
  </div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="row">
    <div class="grp"><span class="lab hp-t">HP</span><div class="btns" data-v="hp"></div></div>
    <div class="grp"><span class="lab sp-t">SP</span><div class="btns" data-v="sp"></div></div>
  </div>
  <div class="row">
    <div><label for="baseHP">Base HP</label><input id="baseHP" type="number" inputmode="numeric" min="0"></div>
    <div><label for="baseSP">Base SP</label><input id="baseSP" type="number" inputmode="numeric" min="0"></div>
    <div><label for="hpBoost">HP boost % mutiplier</label><input id="hpBoost" type="number" inputmode="numeric" min="0"></div>
    <div><label for="spBoost">SP boost % mutiplier</label><input id="spBoost" type="number" inputmode="numeric" min="0"></div>
    <div><label for="gym">Gym bonus (adds HP)</label><input id="gym" type="number" inputmode="numeric" min="0"></div>
    <div><label for="guts">Guts rank (adds HP)</label><select id="guts"></select></div>
  </div>
  <p class="how" id="hpHow"></p>
  <p class="how" id="spHow" style="margin-top:4px"></p>
  <p class="how" id="affHelp"></p>
</div>

<div class="panel ctl">
  <details>
    <summary>Roles, social stats and notes</summary>
    <div class="row" style="display:block;margin-top:12px">
      <div class="three">
        <div><label for="rp">Primary role</label><input id="rp" data-k="roles.p" style="width:100%" autocomplete="off"></div>
        <div><label for="rs">Secondary role</label><input id="rs" data-k="roles.s" style="width:100%" autocomplete="off"></div>
        <div><label for="rt">Tertiary role</label><input id="rt" data-k="roles.t" style="width:100%" autocomplete="off"></div>
      </div>
    </div>
    <div class="row" style="display:block"><span class="lab" id="socLab"></span><div class="five" id="social"></div></div>
    <div class="row" style="display:block"><label for="notes">Notes</label><textarea id="notes" data-k="notes" placeholder="Backstory, items, reminders"></textarea></div>
  </details>
</div>

<div class="panel ctl">
  <details>
    <summary>Total EXP needed for each level</summary>
    <div class="tbl" id="tbl"></div>
  </details>
</div>

<div class="foot"><span>Personas save automatically in this browser. Export a backup to transfer them between devices.</span><button class="b" type="button" id="reset">Reset sheet</button><button class="b" type="button" id="themeBtn">Theme</button></div>

<script src="config.js"></script>
<!-- Must run after config.js and before sheet.js so the selected persona's save key is active. -->
<script src="persona-manager.js"></script>
<script src="sheet.js"></script>
</body>
</html>
